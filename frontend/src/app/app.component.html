<router-outlet></router-outlet>

@if (loadingService.carregando()) {
  <div class="loading-overlay">
    <div class="loading-box shadow-sm rounded-3">
      <!-- Trocado spinner-border (círculo cortado) pelo spinner-grow (pulso suave) -->
      <div class="spinner-grow text-primary mb-3" style="width: 2.5rem; height: 2.5rem;" role="status"></div>
      <span class="small font-monospace text-dark fw-bold">PROCESSANDO...</span>
    </div>
  </div>
}
