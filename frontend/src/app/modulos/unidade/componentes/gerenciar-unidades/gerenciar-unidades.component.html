<div>
  <!-- CABEÇALHO -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Unidades Hospitalares HU-UFS</h1>
      <span class="page-subtitle"
        >Total cadastrado: {{ totalUnidades() }} unidades vinculadas ao sistema</span
      >
    </div>
    <button
      pButton
      type="button"
      label="NOVA UNIDADE"
      icon="pi pi-plus"
      (click)="navegarParaNovo()"
    ></button>
  </div>

  <!-- BARRA DE FILTROS -->
  <div class="filter-card">
    <input
      pInputText
      type="text"
      [ngModel]="termoBusca()"
      (ngModelChange)="termoBusca.set($event)"
      placeholder="Filtrar por nome ou sigla da unidade..."
      class="search-input"
    />
    <p-select
      [options]="opcoesStatus"
      [ngModel]="filtroStatus()"
      (ngModelChange)="filtroStatus.set($event)"
      optionLabel="label"
      optionValue="value"
      class="filter-select"
    />
  </div>

  <!-- TABELA PRIMENG COMPACTA -->
  <p-table
    [value]="unidadesLinhasFiltradas()"
    [tableStyle]="{ 'min-width': '100%' }"
    styleClass="p-datatable-sm p-datatable-striped"
    [paginator]="true"
    [rows]="15"
    [rowsPerPageOptions]="[15, 25, 50]"
    [loading]="carregando()"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="sigla" style="width: 20%">Sigla <p-sortIcon field="sigla" /></th>
        <th pSortableColumn="nome" style="width: 55%">
          Nome da Unidade Hospitalar <p-sortIcon field="nome" />
        </th>
        <th style="width: 12%">Status</th>
        <th style="width: 13%; text-align: right">Ações</th>
      </tr>
    </ng-template>
    <ng-template #body let-u>
      <tr>
        <td>
          <span style="font-weight: 700; color: #0f172a">{{ u.sigla }}</span>
        </td>
        <td>{{ u.nome }}</td>
        <td>
          <p-tag
            [value]="u.ativa ? 'ATIVA' : 'INATIVA'"
            [severity]="u.ativa ? 'success' : 'danger'"
          />
        </td>
        <td>
          <div class="actions-cell">
            <button
              pButton
              type="button"
              icon="pi pi-pencil"
              [text]="true"
              severity="secondary"
              size="small"
              (click)="navegarParaEditar(u.original)"
              pTooltip="Editar Unidade"
              tooltipPosition="top"
              aria-label="Editar Unidade"
            ></button>
            <button
              pButton
              type="button"
              [icon]="u.ativa ? 'pi pi-ban' : 'pi pi-check'"
              [text]="true"
              [severity]="u.ativa ? 'warn' : 'success'"
              size="small"
              (click)="alternarStatus(u.original)"
              [pTooltip]="u.ativa ? 'Inativar Unidade' : 'Reativar Unidade'"
              tooltipPosition="top"
              [attr.aria-label]="u.ativa ? 'Inativar Unidade' : 'Reativar Unidade'"
            ></button>
            <button
              pButton
              type="button"
              icon="pi pi-trash"
              [text]="true"
              severity="danger"
              size="small"
              (click)="excluir(u.original)"
              pTooltip="Excluir Unidade"
              tooltipPosition="top"
              aria-label="Excluir Unidade"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="4" style="text-align: center; padding: 24px; color: #64748b">
          Nenhuma unidade hospitalar encontrada.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
