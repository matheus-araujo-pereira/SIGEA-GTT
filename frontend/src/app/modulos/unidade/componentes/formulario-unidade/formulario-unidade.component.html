<div>
  <!-- CABEÇALHO -->
  <div class="form-header">
    <div>
      <h1 class="form-title">{{ tituloPagina() }}</h1>
      <span class="form-subtitle">{{ subtituloPagina() }}</span>
    </div>
    <button
      pButton
      type="button"
      label="VOLTAR PARA UNIDADES"
      icon="pi pi-arrow-left"
      [outlined]="true"
      severity="secondary"
      (click)="voltarParaListagem()"
    ></button>
  </div>

  @if (mensagemErro()) {
    <p-message severity="error" [text]="mensagemErro()!" styleClass="w-full mb-3" />
  }

  <p-card>
    <form (ngSubmit)="salvar()">
      <div class="form-grid">
        <!-- SIGLA -->
        <div class="field">
          <label for="sigla">Sigla da Unidade *</label>
          <input
            pInputText
            id="sigla"
            type="text"
            [(ngModel)]="formulario.sigla"
            name="sigla"
            required
            maxlength="20"
            placeholder="Ex.: CINF, UTI-GERAL"
            class="w-full"
          />
          <span class="field-hint">Abreviação institucional no HU-UFS.</span>
        </div>

        <!-- NOME DA UNIDADE -->
        <div class="field">
          <label for="nome">Nome Completo da Unidade Hospitalar *</label>
          <input
            pInputText
            id="nome"
            type="text"
            [(ngModel)]="formulario.nome"
            name="nome"
            required
            maxlength="100"
            placeholder="Ex.: Clínica de Doenças Infectocontagiosas"
            class="w-full"
          />
          <span class="field-hint">Nome oficial do setor ou enfermaria hospitalar.</span>
        </div>
      </div>

      <!-- BOTÕES DE AÇÃO -->
      <div class="form-actions">
        <button
          pButton
          type="button"
          label="Cancelar"
          severity="secondary"
          [text]="true"
          (click)="voltarParaListagem()"
        ></button>
        <button
          pButton
          type="submit"
          label="Salvar Unidade"
          icon="pi pi-check"
          [loading]="salvando()"
        ></button>
      </div>
    </form>
  </p-card>
</div>
