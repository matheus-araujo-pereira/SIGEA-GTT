<div class="page-container" style="display: flex; flex-direction: column; gap: 1.5rem">
  <!-- CABEÇALHO DO FORMULÁRIO -->
  <div
    style="
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--p-content-border-color, #e2e8f0);
      padding-bottom: 1rem;
    "
  >
    <div>
      <h1 style="font-size: 1.5rem; font-weight: 700; color: #0f172a; margin: 0">
        {{ tituloPagina() }}
      </h1>
      <span style="font-size: 0.875rem; color: #64748b">{{ subtituloPagina() }}</span>
    </div>
    <p-button
      label="VOLTAR PARA ATIVIDADES"
      icon="pi pi-arrow-left"
      [outlined]="true"
      severity="secondary"
      size="small"
      (onClick)="voltarParaListagem()"
    />
  </div>

  @if (mensagemErro()) {
    <p-message severity="error" [text]="mensagemErro()!" styleClass="w-full" />
  }

  @if (carregando()) {
    <div
      style="
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        padding: 4rem;
        background: #ffffff;
        border-radius: 6px;
        border: 1px solid var(--p-content-border-color, #e2e8f0);
      "
    >
      <p-progressSpinner styleClass="w-4rem h-4rem" strokeWidth="4" />
      <span style="color: #64748b">Carregando dados da atividade...</span>
    </div>
  } @else {
    <p-card header="Configurações da Atividade Prática">
      <form (ngSubmit)="salvar()" style="display: flex; flex-direction: column; gap: 1.5rem">
        <!-- TÍTULO DA ATIVIDADE -->
        <div style="display: flex; flex-direction: column; gap: 0.5rem">
          <label for="titulo" style="font-size: 0.875rem; font-weight: 600; color: #1e293b">
            Título da Atividade <span style="color: #ef4444">*</span>
          </label>
          <input
            pInputText
            id="titulo"
            type="text"
            [(ngModel)]="formulario.titulo"
            name="titulo"
            placeholder="Ex.: Auditoria de Prontuário 01 - Rastreamento de Gatilhos e Análise 6M"
            class="w-full"
            required
          />
        </div>

        <!-- TURMA E CASO CLÍNICO -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem">
          <div style="display: flex; flex-direction: column; gap: 0.5rem">
            <label for="turmaId" style="font-size: 0.875rem; font-weight: 600; color: #1e293b">
              Turma Acadêmica <span style="color: #ef4444">*</span>
            </label>
            <p-select
              inputId="turmaId"
              [options]="turmasOpcoes()"
              optionLabel="label"
              optionValue="value"
              [(ngModel)]="formulario.turmaId"
              name="turmaId"
              placeholder="Selecione a turma..."
              styleClass="w-full"
            />
          </div>

          <div style="display: flex; flex-direction: column; gap: 0.5rem">
            <label
              for="casoClinicoId"
              style="font-size: 0.875rem; font-weight: 600; color: #1e293b"
            >
              Caso Clínico Simulado <span style="color: #ef4444">*</span>
            </label>
            <p-select
              inputId="casoClinicoId"
              [options]="casosOpcoes()"
              optionLabel="label"
              optionValue="value"
              [(ngModel)]="formulario.casoClinicoId"
              name="casoClinicoId"
              placeholder="Selecione o caso clínico..."
              styleClass="w-full"
            />
          </div>
        </div>

        <!-- PRAZOS E TEMPO LIMITE -->
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem">
          <div style="display: flex; flex-direction: column; gap: 0.5rem">
            <label for="dataInicio" style="font-size: 0.875rem; font-weight: 600; color: #1e293b">
              Data de Abertura <span style="color: #ef4444">*</span>
            </label>
            <input
              pInputText
              id="dataInicio"
              type="date"
              [(ngModel)]="formulario.dataInicio"
              name="dataInicio"
              class="w-full"
              required
            />
          </div>

          <div style="display: flex; flex-direction: column; gap: 0.5rem">
            <label for="dataFim" style="font-size: 0.875rem; font-weight: 600; color: #1e293b">
              Prazo Limite para Envio <span style="color: #ef4444">*</span>
            </label>
            <input
              pInputText
              id="dataFim"
              type="date"
              [(ngModel)]="formulario.dataFim"
              name="dataFim"
              class="w-full"
              required
            />
          </div>

          <div style="display: flex; flex-direction: column; gap: 0.5rem">
            <label
              for="tempoLimiteMinutos"
              style="font-size: 0.875rem; font-weight: 600; color: #1e293b"
            >
              Tempo Limite (minutos) <span style="color: #ef4444">*</span>
            </label>
            <p-inputNumber
              inputId="tempoLimiteMinutos"
              [(ngModel)]="formulario.tempoLimiteMinutos"
              name="tempoLimiteMinutos"
              suffix=" min (IHI GTT: 20)"
              [min]="1"
              [max]="180"
              styleClass="w-full"
            />
          </div>
        </div>

        <!-- ORIENTAÇÕES PEDAGÓGICAS -->
        <div style="display: flex; flex-direction: column; gap: 0.5rem">
          <label
            for="orientacoesPedagogicas"
            style="font-size: 0.875rem; font-weight: 600; color: #1e293b"
          >
            Orientações Pedagógicas para os Alunos
          </label>
          <textarea
            pTextarea
            id="orientacoesPedagogicas"
            rows="4"
            [(ngModel)]="formulario.orientacoesPedagogicas"
            name="orientacoesPedagogicas"
            placeholder="Instruções aos discentes sobre a realização da auditoria clínica, busca ativa de gatilhos nos registros e preenchimento dos pilares 6M, 5W3H e PDCA..."
            class="w-full"
          ></textarea>
        </div>

        <!-- STATUS ATIVO -->
        <div style="display: flex; align-items: center; gap: 0.75rem">
          <p-toggleswitch inputId="ativa" [(ngModel)]="formulario.ativa" name="ativa" />
          <label
            for="ativa"
            style="font-size: 0.875rem; font-weight: 600; color: #1e293b; cursor: pointer"
          >
            Atividade Ativa (visível para os alunos realizarem)
          </label>
        </div>

        <!-- BOTÕES -->
        <div
          style="
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            border-top: 1px solid var(--p-content-border-color, #e2e8f0);
            padding-top: 1rem;
            margin-top: 0.5rem;
          "
        >
          <p-button
            label="Cancelar"
            [outlined]="true"
            severity="secondary"
            size="small"
            (onClick)="voltarParaListagem()"
          />
          <p-button
            [label]="modoEdicao() ? 'Salvar Alterações' : 'Criar Atividade'"
            icon="pi pi-check"
            type="submit"
            size="small"
            [loading]="salvando()"
          />
        </div>
      </form>
    </p-card>
  }
</div>
