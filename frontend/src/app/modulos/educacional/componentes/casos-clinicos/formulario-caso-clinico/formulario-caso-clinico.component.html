<div class="page-container" style="display: flex; flex-direction: column; gap: 1.5rem">
  <!-- CABEÇALHO DO FORMULÁRIO -->
  <div
    style="
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--p-content-border-color, #e2e8f0);
      padding-bottom: 1rem;
    "
  >
    <div>
      <h1 style="font-size: 1.5rem; font-weight: 700; color: #0f172a; margin: 0">
        {{ tituloPagina() }}
      </h1>
      <span style="font-size: 0.875rem; color: #64748b">{{ subtituloPagina() }}</span>
    </div>
    <p-button
      label="VOLTAR PARA CASOS"
      icon="pi pi-arrow-left"
      [outlined]="true"
      severity="secondary"
      size="small"
      (onClick)="voltarParaListagem()"
    />
  </div>

  @if (mensagemErro()) {
    <p-message severity="error" [text]="mensagemErro()!" styleClass="w-full" />
  }

  @if (carregando()) {
    <div
      style="
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        padding: 4rem;
        background: #ffffff;
        border-radius: 6px;
        border: 1px solid var(--p-content-border-color, #e2e8f0);
      "
    >
      <p-progressSpinner styleClass="w-4rem h-4rem" strokeWidth="4" />
      <span style="color: #64748b">Carregando dados do caso clínico...</span>
    </div>
  } @else {
    <form (ngSubmit)="salvar()" style="display: flex; flex-direction: column; gap: 1.5rem">
      <!-- CARD 1: IDENTIFICAÇÃO DO CASO -->
      <p-card header="1. Identificação Geral do Caso Clínico">
        <div style="display: flex; flex-direction: column; gap: 1.25rem">
          <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem">
            <div style="display: flex; flex-direction: column; gap: 0.5rem">
              <label for="titulo" style="font-size: 0.875rem; font-weight: 600; color: #1e293b">
                Título Descritivo do Caso <span style="color: #ef4444">*</span>
              </label>
              <input
                pInputText
                id="titulo"
                type="text"
                [(ngModel)]="formulario.titulo"
                name="titulo"
                required
                placeholder="Ex.: Caso 01 - IAM e Sangramento Digestivo Pós-Trombólise"
                class="w-full"
              />
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.5rem">
              <label
                for="unidadeHospitalarId"
                style="font-size: 0.875rem; font-weight: 600; color: #1e293b"
              >
                Unidade Hospitalar (HU) <span style="color: #ef4444">*</span>
              </label>
              <p-select
                inputId="unidadeHospitalarId"
                [options]="unidades()"
                optionLabel="nome"
                optionValue="id"
                [(ngModel)]="formulario.unidadeHospitalarId"
                name="unidadeHospitalarId"
                placeholder="Selecione a unidade..."
                styleClass="w-full"
              />
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem">
            <div style="display: flex; flex-direction: column; gap: 0.5rem">
              <label
                for="objetivosAprendizagem"
                style="font-size: 0.875rem; font-weight: 600; color: #1e293b"
              >
                Objetivos Pedagógicos de Aprendizagem
              </label>
              <textarea
                pTextarea
                id="objetivosAprendizagem"
                rows="3"
                [(ngModel)]="formulario.objetivosAprendizagem"
                name="objetivosAprendizagem"
                placeholder="Ex.: Reconhecer gatilhos de medicação e anticoagulação, analisar causa-raiz com 6M..."
                class="w-full"
              ></textarea>
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.5rem">
              <label
                for="descricaoCaso"
                style="font-size: 0.875rem; font-weight: 600; color: #1e293b"
              >
                Contextualização Clínica
              </label>
              <textarea
                pTextarea
                id="descricaoCaso"
                rows="3"
                [(ngModel)]="formulario.descricaoCaso"
                name="descricaoCaso"
                placeholder="Breve resumo clínico para orientação do docente ou equipe..."
                class="w-full"
              ></textarea>
            </div>
          </div>
        </div>
      </p-card>

      <!-- CARD 2: DADOS DO PACIENTE E PERÍODO -->
      <p-card header="2. Dados do Paciente e Período de Internação">
        <div
          style="
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr;
            gap: 1.25rem;
            align-items: flex-end;
          "
        >
          <div style="display: flex; flex-direction: column; gap: 0.5rem">
            <label
              for="numeroAtendimento"
              style="font-size: 0.875rem; font-weight: 600; color: #1e293b"
            >
              Nº Prontuário / Atendimento <span style="color: #ef4444">*</span>
            </label>
            <input
              pInputText
              id="numeroAtendimento"
              type="text"
              [(ngModel)]="formulario.numeroAtendimento"
              name="numeroAtendimento"
              placeholder="Ex.: PRONT-2026-001"
              style="font-family: monospace"
              class="w-full"
              required
            />
          </div>

          <div style="display: flex; flex-direction: column; gap: 0.5rem">
            <label
              for="idadePaciente"
              style="font-size: 0.875rem; font-weight: 600; color: #1e293b"
            >
              Idade (anos) <span style="color: #ef4444">*</span>
            </label>
            <p-inputNumber
              inputId="idadePaciente"
              [(ngModel)]="formulario.idadePaciente"
              name="idadePaciente"
              [min]="0"
              [max]="130"
              styleClass="w-full"
            />
          </div>

          <div style="display: flex; flex-direction: column; gap: 0.5rem">
            <label for="dataAdmissao" style="font-size: 0.875rem; font-weight: 600; color: #1e293b">
              Data Admissão <span style="color: #ef4444">*</span>
            </label>
            <input
              pInputText
              id="dataAdmissao"
              type="date"
              [(ngModel)]="formulario.dataAdmissao"
              (change)="calcularDias()"
              name="dataAdmissao"
              class="w-full"
              required
            />
          </div>

          <div style="display: flex; flex-direction: column; gap: 0.5rem">
            <label for="dataAlta" style="font-size: 0.875rem; font-weight: 600; color: #1e293b">
              Data Alta / Desfecho <span style="color: #ef4444">*</span>
            </label>
            <input
              pInputText
              id="dataAlta"
              type="date"
              [(ngModel)]="formulario.dataAlta"
              (change)="calcularDias()"
              name="dataAlta"
              class="w-full"
              required
            />
          </div>

          <div style="display: flex; flex-direction: column; gap: 0.5rem">
            <label
              for="tempoPermanenciaDias"
              style="font-size: 0.875rem; font-weight: 600; color: #1e293b"
            >
              Permanência (dias)
            </label>
            <p-inputNumber
              inputId="tempoPermanenciaDias"
              [(ngModel)]="formulario.tempoPermanenciaDias"
              name="tempoPermanenciaDias"
              [min]="0"
              styleClass="w-full"
            />
          </div>
        </div>
      </p-card>

      <!-- CARD 3: SESSÕES DO PRONTUÁRIO SIMULADO -->
      <p-card header="3. Registros Clínicos Simulados do Prontuário">
        <div style="display: flex; flex-direction: column; gap: 1.25rem">
          <div style="display: flex; flex-direction: column; gap: 0.5rem">
            <label for="sumarioAlta" style="font-size: 0.875rem; font-weight: 600; color: #1e293b">
              Sumário de Alta, Anamnese e Hipóteses Diagnósticas
              <span style="color: #ef4444">*</span>
            </label>
            <textarea
              pTextarea
              id="sumarioAlta"
              rows="4"
              [(ngModel)]="formulario.sumarioAlta"
              name="sumarioAlta"
              style="font-family: monospace"
              placeholder="Histórico da admissão, queixa principal, hipóteses diagnósticas e evolução para alta..."
              class="w-full"
              required
            ></textarea>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem">
            <div style="display: flex; flex-direction: column; gap: 0.5rem">
              <label
                for="prescricoesMedicas"
                style="font-size: 0.875rem; font-weight: 600; color: #1e293b"
              >
                Prescrições Médicas e Farmacoterapia
              </label>
              <textarea
                pTextarea
                id="prescricoesMedicas"
                rows="5"
                [(ngModel)]="formulario.prescricoesMedicas"
                name="prescricoesMedicas"
                style="font-family: monospace"
                placeholder="Medicamentos prescritos, dosagens, horários, diluições, suspensões..."
                class="w-full"
              ></textarea>
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.5rem">
              <label
                for="examesLaboratoriais"
                style="font-size: 0.875rem; font-weight: 600; color: #1e293b"
              >
                Resultados de Exames Laboratoriais e Imagem
              </label>
              <textarea
                pTextarea
                id="examesLaboratoriais"
                rows="5"
                [(ngModel)]="formulario.examesLaboratoriais"
                name="examesLaboratoriais"
                style="font-family: monospace"
                placeholder="Hemograma, coagulograma, gasometria, creatinina, glicemia, raio-X..."
                class="w-full"
              ></textarea>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem">
            <div style="display: flex; flex-direction: column; gap: 0.5rem">
              <label
                for="evolucoesMultiprofissionais"
                style="font-size: 0.875rem; font-weight: 600; color: #1e293b"
              >
                Evoluções Multiprofissionais (Enfermagem, Farmácia, Médica, etc.)
              </label>
              <textarea
                pTextarea
                id="evolucoesMultiprofissionais"
                rows="5"
                [(ngModel)]="formulario.evolucoesMultiprofissionais"
                name="evolucoesMultiprofissionais"
                style="font-family: monospace"
                placeholder="Notas de enfermagem, sinais vitais, intercorrências, checagem de beira de leito..."
                class="w-full"
              ></textarea>
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.5rem">
              <label
                for="relatorioCirurgico"
                style="font-size: 0.875rem; font-weight: 600; color: #1e293b"
              >
                Relatório Cirúrgico e Anestésico (Opcional)
              </label>
              <textarea
                pTextarea
                id="relatorioCirurgico"
                rows="5"
                [(ngModel)]="formulario.relatorioCirurgico"
                name="relatorioCirurgico"
                style="font-family: monospace"
                placeholder="Descrição do procedimento cirúrgico, técnica anestésica, contagem de compressas, sangramento..."
                class="w-full"
              ></textarea>
            </div>
          </div>
        </div>
      </p-card>

      <!-- BOTÕES DE SUBMISSÃO -->
      <div
        style="
          display: flex;
          justify-content: flex-end;
          gap: 0.75rem;
          background: #ffffff;
          padding: 1rem;
          border-radius: 6px;
          border: 1px solid var(--p-content-border-color, #e2e8f0);
        "
      >
        <p-button
          label="Cancelar"
          [outlined]="true"
          severity="secondary"
          size="small"
          (onClick)="voltarParaListagem()"
        />
        <p-button
          [label]="modoEdicao() ? 'Salvar Alterações' : 'Cadastrar Caso Clínico'"
          icon="pi pi-check"
          type="submit"
          size="small"
          [loading]="salvando()"
        />
      </div>
    </form>
  }
</div>
