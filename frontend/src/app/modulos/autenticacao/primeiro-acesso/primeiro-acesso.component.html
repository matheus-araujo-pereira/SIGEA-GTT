<div class="d-flex align-items-center justify-content-center min-vh-100 bg-light p-3">
  <div class="bg-white b-1 p-4" style="width: 100%; max-width: 400px;">
    <div class="mb-4 pb-2 b-b">
      <h1 class="h5 fw-bold text-dark m-0 font-monospace">PRIMEIRO ACESSO</h1>
      <span class="text-secondary small font-sans-serif">Defina sua nova senha pessoal: {{ nomeUsuario() }}</span>
    </div>

    @if (mensagemErro()) {
      <div class="p-2 mb-3 bg-white b-1 border-danger text-danger small d-flex justify-content-between">
        <span>{{ mensagemErro() }}</span>
        <button type="button" class="btn btn-sm p-0 text-danger" (click)="mensagemErro.set(null)">[X]</button>
      </div>
    }

    <form (ngSubmit)="confirmarRedefinicao()">
      <div class="mb-3">
        <label for="senhaAtual" class="form-label small text-secondary m-0">Senha Atual (Temporária)</label>
        <input id="senhaAtual"
               type="password"
               class="form-control form-control-sm font-monospace"
               [(ngModel)]="senhaAtual"
               name="senhaAtual"
               autocomplete="current-password"
               required>
      </div>

      <div class="mb-3">
        <label for="novaSenha" class="form-label small text-secondary m-0">Nova Senha</label>
        <input id="novaSenha"
               type="password"
               class="form-control form-control-sm font-monospace"
               [(ngModel)]="novaSenha"
               name="novaSenha"
               minlength="6"
               autocomplete="new-password"
               required>
      </div>

      <div class="mb-3">
        <label for="confirmacao" class="form-label small text-secondary m-0">Confirmar Nova Senha</label>
        <input id="confirmacao"
               type="password"
               class="form-control form-control-sm font-monospace"
               [(ngModel)]="confirmacao"
               name="confirmacao"
               autocomplete="new-password"
               required>
      </div>

      <button type="submit" class="btn btn-primary btn-sm w-100 py-2 font-monospace" [disabled]="carregando()">
        {{ textoBotao() }}
      </button>
    </form>
  </div>
</div>
