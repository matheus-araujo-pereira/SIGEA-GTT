<div class="d-flex align-items-center justify-content-center min-vh-100 bg-light p-3">
  <div class="bg-white b-1 p-4" style="width: 100%; max-width: 380px;">
    <div class="mb-4 pb-2 b-b">
      <h1 class="h5 fw-bold text-dark m-0 font-monospace">SIGEA-GTT</h1>
      <span class="text-secondary small">Sistema de Auditoria Clínica e Riscos (IHI-GTT)</span>
    </div>

    @if (mensagemErro()) {
      <div class="p-2 mb-3 bg-white b-1 border-danger text-danger small d-flex justify-content-between">
        <span>{{ mensagemErro() }}</span>
        <button type="button" class="btn btn-sm p-0 text-danger" (click)="mensagemErro.set(null)">[X]</button>
      </div>
    }

    <form (ngSubmit)="entrar()">
      <div class="mb-3">
        <label for="identificador" class="form-label small text-secondary m-0">E-mail Institucional (&#64;academico.ufs.br)</label>
        <input id="identificador"
               type="email"
               class="form-control form-control-sm font-monospace"
               [(ngModel)]="identificador"
               name="identificador"
               autocomplete="username"
               placeholder="usuario@academico.ufs.br"
               required>
      </div>

      <div class="mb-3">
        <label for="senha" class="form-label small text-secondary m-0">Senha</label>
        <input id="senha"
               type="password"
               class="form-control form-control-sm font-monospace"
               [(ngModel)]="senha"
               name="senha"
               autocomplete="current-password"
               required>
      </div>

      <button type="submit" class="btn btn-primary btn-sm w-100 py-2 font-monospace" [disabled]="carregando()">
        {{ textoBotao() }}
      </button>
    </form>
  </div>
</div>
