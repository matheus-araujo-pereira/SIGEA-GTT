<div class="login-wrapper">
  <p-card styleClass="login-card">
    <ng-template #header>
      <div class="login-header">
        <h1 class="login-title">SIGEA-GTT</h1>
        <p class="login-subtitle">
          Sistema Inteligente de Gestão de Eventos Adversos – Global Trigger Tool
        </p>
        <span class="login-hospital">Hospital Universitário HU-UFS</span>
      </div>
    </ng-template>

    @if (mensagemErro()) {
      <p-message severity="error" [text]="mensagemErro()!" styleClass="w-full mb-3" />
    }

    <form (ngSubmit)="entrar()" class="login-form">
      <div class="form-field">
        <label for="identificador">E-mail Institucional (&#64;academico.ufs.br)</label>
        <input
          pInputText
          id="identificador"
          type="email"
          [(ngModel)]="identificador"
          name="identificador"
          autocomplete="username"
          placeholder="usuario@academico.ufs.br"
          required
          class="w-full"
        />
      </div>

      <div class="form-field">
        <label for="senha">Senha</label>
        <p-password
          id="senha"
          [(ngModel)]="senha"
          name="senha"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="current-password"
          required
          styleClass="w-full"
          inputStyleClass="w-full"
        />
      </div>

      <p-button
        type="submit"
        [label]="textoBotao()"
        icon="pi pi-sign-in"
        [loading]="carregando()"
        styleClass="w-full mt-2"
      />
    </form>
  </p-card>
</div>
