<div class="primeiro-acesso-wrapper">
  <p-card styleClass="auth-card">
    <ng-template #header>
      <div class="auth-header">
        <h1 class="auth-title">PRIMEIRO ACESSO</h1>
        <p class="auth-subtitle">
          Defina sua nova senha pessoal: <strong>{{ nomeUsuario() }}</strong>
        </p>
      </div>
    </ng-template>

    @if (mensagemErro()) {
      <p-message severity="error" [text]="mensagemErro()!" styleClass="w-full mb-3" />
    }

    <form (ngSubmit)="confirmarRedefinicao()" class="auth-form">
      <div class="form-field">
        <label for="senhaAtual">Senha Atual (Temporária)</label>
        <p-password
          id="senhaAtual"
          [(ngModel)]="senhaAtual"
          name="senhaAtual"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="current-password"
          required
          styleClass="w-full"
          inputStyleClass="w-full"
        />
      </div>

      <div class="form-field">
        <label for="novaSenha">Nova Senha (mínimo 6 caracteres)</label>
        <p-password
          id="novaSenha"
          [(ngModel)]="novaSenha"
          name="novaSenha"
          [feedback]="true"
          [toggleMask]="true"
          autocomplete="new-password"
          required
          styleClass="w-full"
          inputStyleClass="w-full"
        />
      </div>

      <div class="form-field">
        <label for="confirmacao">Confirmar Nova Senha</label>
        <p-password
          id="confirmacao"
          [(ngModel)]="confirmacao"
          name="confirmacao"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="new-password"
          required
          styleClass="w-full"
          inputStyleClass="w-full"
        />
      </div>

      <p-button
        type="submit"
        [label]="textoBotao()"
        icon="pi pi-check"
        [loading]="carregando()"
        styleClass="w-full mt-2"
      />
    </form>
  </p-card>
</div>
