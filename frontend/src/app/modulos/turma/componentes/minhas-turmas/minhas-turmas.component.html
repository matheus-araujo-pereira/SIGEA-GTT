<div>
  <!-- CABEÇALHO -->
  <div class="page-header">
    <h1 class="page-title">Minhas Turmas Vinculadas</h1>
    <span class="page-subtitle">Acesso rápido às turmas sob sua docência no SIGEA-GTT</span>
  </div>

  <!-- BARRA DE BUSCA -->
  <div class="search-card">
    <input
      pInputText
      type="text"
      [ngModel]="termoBusca()"
      (ngModelChange)="termoBusca.set($event)"
      placeholder="Filtrar por código de disciplina ou período letivo..."
      style="width: 100%"
    />
  </div>

  <!-- TABELA PRIMENG COMPACTA -->
  <p-table
    [value]="turmasFiltradas()"
    [tableStyle]="{ 'min-width': '100%' }"
    styleClass="p-datatable-sm p-datatable-striped"
    [paginator]="true"
    [rows]="15"
    [rowsPerPageOptions]="[15, 25, 50]"
    [loading]="carregando()"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="codigoDisciplina" style="width: 35%">
          Código da Disciplina <p-sortIcon field="codigoDisciplina" />
        </th>
        <th pSortableColumn="periodoLetivo" style="width: 25%">
          Período Letivo <p-sortIcon field="periodoLetivo" />
        </th>
        <th pSortableColumn="totalAlunos" style="width: 20%">
          Discentes <p-sortIcon field="totalAlunos" />
        </th>
        <th style="width: 10%">Status</th>
        <th style="width: 10%; text-align: right">Ações</th>
      </tr>
    </ng-template>
    <ng-template #body let-t>
      <tr>
        <td>
          <span style="font-weight: 600; color: #0f172a">{{ t.codigoDisciplina }}</span>
        </td>
        <td>
          <code>{{ t.periodoLetivo }}</code>
        </td>
        <td>
          <p-tag [value]="t.totalAlunos + ' aluno(s)'" severity="info" />
        </td>
        <td>
          <p-tag
            [value]="t.ativa ? 'ATIVA' : 'INATIVA'"
            [severity]="t.ativa ? 'success' : 'danger'"
          />
        </td>
        <td>
          <div class="actions-cell">
            <button
              pButton
              type="button"
              icon="pi pi-users"
              [text]="true"
              severity="secondary"
              size="small"
              (click)="verAlunos(t.id)"
              pTooltip="Ver Alunos Matriculados"
              tooltipPosition="top"
              aria-label="Ver Alunos"
            ></button>
            <button
              pButton
              type="button"
              icon="pi pi-calendar"
              [text]="true"
              severity="info"
              size="small"
              (click)="verAtividades(t.id)"
              pTooltip="Ver Atividades da Turma"
              tooltipPosition="top"
              aria-label="Ver Atividades"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="5" style="text-align: center; padding: 24px; color: #64748b">
          Nenhuma turma vinculada a seu cadastro docente.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
