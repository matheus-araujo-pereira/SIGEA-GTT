<div>
  <!-- CABEÇALHO -->
  <div class="form-header">
    <div>
      <h1 class="form-title">{{ tituloPagina() }}</h1>
      <span class="form-subtitle">{{ subtituloPagina() }}</span>
    </div>
    <button
      pButton
      type="button"
      label="VOLTAR PARA TURMAS"
      icon="pi pi-arrow-left"
      [outlined]="true"
      severity="secondary"
      (click)="voltarParaListagem()"
    ></button>
  </div>

  @if (mensagemErro()) {
    <p-message severity="error" [text]="mensagemErro()!" styleClass="w-full mb-3" />
  }

  <p-card>
    <form (ngSubmit)="salvar()">
      <div class="form-grid">
        <!-- CÓDIGO DA DISCIPLINA -->
        <div class="field">
          <label for="codigoDisciplina">Código da Disciplina *</label>
          <input
            pInputText
            id="codigoDisciplina"
            type="text"
            [(ngModel)]="formulario.codigoDisciplina"
            name="codigoDisciplina"
            required
            maxlength="30"
            placeholder="Ex.: MED0023, ENF0010"
            class="w-full"
          />
          <span class="field-hint">Código alfanumérico cadastrado no SIGAA.</span>
        </div>

        <!-- PERÍODO LETIVO -->
        <div class="field">
          <label for="periodoLetivo">Período Letivo *</label>
          <input
            pInputText
            id="periodoLetivo"
            type="text"
            [(ngModel)]="formulario.periodoLetivo"
            name="periodoLetivo"
            required
            maxlength="10"
            placeholder="Ex.: 2026.1"
            class="w-full"
          />
          <span class="field-hint">Formato: AAAA.S (Ano e Semestre).</span>
        </div>

        <!-- DOCENTE RESPONSÁVEL -->
        <div class="field" style="grid-column: span 2">
          <label for="professorResponsavelId">Docente Responsável *</label>
          <p-select
            id="professorResponsavelId"
            [options]="professores()"
            [(ngModel)]="formulario.professorResponsavelId"
            name="professorResponsavelId"
            optionLabel="label"
            optionValue="value"
            placeholder="Selecione o professor responsável"
            styleClass="w-full"
          />
          <span class="field-hint"
            >Docente que terá acesso às atividades e avaliações desta turma.</span
          >
        </div>
      </div>

      <!-- BOTÕES DE AÇÃO -->
      <div class="form-actions">
        <button
          pButton
          type="button"
          label="Cancelar"
          severity="secondary"
          [text]="true"
          (click)="voltarParaListagem()"
        ></button>
        <button
          pButton
          type="submit"
          label="Salvar Turma"
          icon="pi pi-check"
          [loading]="salvando()"
        ></button>
      </div>
    </form>
  </p-card>
</div>
