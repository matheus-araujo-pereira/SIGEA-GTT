<div class="d-flex app-viewport-fhd">
  <aside class="sidebar-fhd d-flex flex-column justify-content-between">
    <div>
      <div class="p-3 b-b">
        <span class="fw-bold text-dark d-block">SIGEA-GTT</span>
        <span class="text-secondary small font-monospace">UFS / DCOMP</span>
      </div>

      <nav class="p-2">
        @for (grupo of gruposMenu(); track grupo.titulo) {
          <div class="text-uppercase text-muted fw-bold px-2 mt-3 mb-1 fs-xxs">
            {{ grupo.titulo }}
          </div>
          @for (item of grupo.itens; track item.rota) {
            <a
              [routerLink]="item.rota"
              routerLinkActive="active"
              class="nav-link py-2 px-3 d-flex align-items-center gap-2 mb-1"
            >
              <i class="bi" [class]="item.icone"></i>
              <span>{{ item.rotulo }}</span>
            </a>
          }
        }
      </nav>
    </div>

    <!-- RODAPÉ DA SIDEBAR COM INDICAÇÃO DE PERFIL E ÍCONE AO LADO DO BOTÃO SAIR -->
    <div
      class="p-3 b-t d-flex justify-content-between align-items-center bg-light-subtle"
    >
      <a
        routerLink="/perfil"
        class="d-flex align-items-center gap-2 overflow-hidden text-decoration-none flex-grow-1 me-2 link-dark"
        title="Acessar Meu Perfil"
      >
        <div
          class="rounded-circle bg-white border border-secondary-subtle d-flex align-items-center justify-content-center flex-shrink-0"
          style="width: 36px; height: 36px"
        >
          <i class="bi bi-person-circle text-primary fs-5"></i>
        </div>
        <div class="overflow-hidden">
          <div class="fw-bold text-truncate small text-dark lh-sm">
            {{ nomeUsuario() }}
          </div>
          <div
            class="text-secondary fs-xxs d-flex align-items-center gap-1 font-monospace"
          >
            <span>{{ perfilUsuario() }}</span>
            <span class="text-primary fw-medium font-sans-serif"
              >• Ver Perfil</span
            >
          </div>
        </div>
      </a>
      <div class="d-flex align-items-center gap-1 flex-shrink-0">
        <a
          routerLink="/perfil"
          class="btn btn-outline-primary btn-sm"
          title="Ver Meu Perfil"
        >
          <i class="bi bi-person"></i>
        </a>
        <button
          type="button"
          class="btn btn-outline-danger btn-sm"
          (click)="sair()"
          title="Encerrar Sessão"
        >
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </aside>

  <main class="content-fhd">
    <router-outlet></router-outlet>
  </main>
</div>
