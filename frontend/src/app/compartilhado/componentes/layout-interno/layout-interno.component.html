<div class="d-flex app-viewport-fhd">
  <aside class="sidebar-fhd d-flex flex-column justify-content-between">
    <div>
      <div class="p-3 b-b">
        <span class="fw-bold text-dark d-block">SIGEA-GTT</span>
        <span class="text-secondary small font-monospace">UFS / DCOMP</span>
      </div>

      <nav class="p-2">
        @for (grupo of gruposMenu(); track grupo.titulo) {
          <div class="text-uppercase text-muted fw-bold px-2 mt-3 mb-1 fs-xxs">{{ grupo.titulo }}</div>
          @for (item of grupo.itens; track item.rota) {
            <a [routerLink]="item.rota"
               routerLinkActive="active"
               class="nav-link py-2 px-3 d-flex align-items-center gap-2 mb-1">
              <i class="bi" [class]="item.icone"></i>
              <span>{{ item.rotulo }}</span>
            </a>
          }
        }
      </nav>
    </div>

    <div class="p-3 b-t d-flex justify-content-between align-items-center">
      <div class="overflow-hidden me-2">
        <div class="fw-bold text-truncate small">{{ nomeUsuario() }}</div>
        <span class="font-monospace text-muted fs-xxs">{{ perfilUsuario() }}</span>
      </div>
      <button type="button" class="btn btn-outline-danger btn-sm" (click)="sair()" title="Encerrar Sessão">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  </aside>

  <main class="content-fhd">
    <router-outlet></router-outlet>
  </main>
</div>
