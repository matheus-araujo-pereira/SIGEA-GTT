@if (visivel()) {
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 p-2 bg-white b-1 mt-2">
    <span class="text-secondary small font-monospace">{{ textoResumo() }}</span>

    <div class="d-flex gap-1">
      <button type="button"
              class="btn btn-outline-secondary btn-sm py-0 px-2 font-monospace"
              [disabled]="desabilitarAnterior()"
              (click)="irParaPrimeira()"
              title="Primeira Página">
        &laquo;
      </button>

      <button type="button"
              class="btn btn-outline-secondary btn-sm py-0 px-2 font-monospace"
              [disabled]="desabilitarAnterior()"
              (click)="irParaAnterior()"
              title="Página Anterior">
        &lsaquo;
      </button>

      @for (btn of botoesPaginas(); track btn.numero) {
        <button type="button"
                class="btn btn-sm py-0 px-2 font-monospace"
                [class.btn-primary]="btn.ativo"
                [class.btn-outline-secondary]="!btn.ativo"
                (click)="irParaPagina(btn.numero)">
          {{ btn.numero }}
        </button>
      }

      <button type="button"
              class="btn btn-outline-secondary btn-sm py-0 px-2 font-monospace"
              [disabled]="desabilitarProxima()"
              (click)="irParaProxima()"
              title="Próxima Página">
        &rsaquo;
      </button>

      <button type="button"
              class="btn btn-outline-secondary btn-sm py-0 px-2 font-monospace"
              [disabled]="desabilitarProxima()"
              (click)="irParaUltima()"
              title="Última Página">
        &raquo;
      </button>
    </div>
  </div>
}
