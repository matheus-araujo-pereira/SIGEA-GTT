services:
  - type: web
    name: sigea-gtt-backend
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: sigea-gtt-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sigea-gtt-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: sigea-gtt-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: sigea-gtt-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sigea-gtt-db
          property: password
      - key: FRONTEND_ORIGIN
        # Render atribui o domínio "<nome-do-serviço>.onrender.com" por padrão.
        # Se você renomear o serviço "sigea-gtt-frontend", atualize este valor.
        value: https://sigea-gtt-frontend.onrender.com

  - type: web
    name: sigea-gtt-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && printf 'window.__SIGEA_API_URL__ = "https://%s";\n' "$BACKEND_URL" > src/assets/runtime-config.js && npm run build
    # O builder "application" do Angular 17 gera o site em dist/frontend/browser, não em dist/frontend.
    staticPublishPath: dist/frontend/browser
    envVars:
      - key: BACKEND_URL
        fromService:
          name: sigea-gtt-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: sigea-gtt-db
    plan: free
