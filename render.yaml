services:
  - type: web
    name: sigea-gtt-backend
    runtime: docker
    rootDir: backend
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: sigea-gtt-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: sigea-gtt-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sigea-gtt-db
          property: password

  - type: web
    name: sigea-gtt-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && printf 'window.__SIGEA_API_URL__ = "https://%s";\n' "$BACKEND_URL" > src/assets/runtime-config.js && npm run build
    staticPublishPath: dist/frontend
    envVars:
      - key: BACKEND_URL
        fromService:
          name: sigea-gtt-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: sigea-gtt-db
