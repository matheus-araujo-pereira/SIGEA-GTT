server:
  port: 8080

spring:
  application:
    name: sigea-gtt-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/sigea_gtt
    username: sigea_admin
    password: sigea_dev_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
