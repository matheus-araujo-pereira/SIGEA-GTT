server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:4200}

spring:
  application:
    name: sigea-gtt-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sigea_gtt}
    username: ${DB_USERNAME:sigea_admin}
    password: ${DB_PASSWORD:sigea_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        "[format_sql]": true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
